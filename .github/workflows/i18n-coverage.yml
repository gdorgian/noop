# Aura's iOS redesign is English-only for this release. The upstream translation
# gate required Android and non-English catalog coverage this fork does not ship.
# Keep a real source-catalog integrity check; do not report partial translations
# as complete or force the prototype's English copy into invented translations.
name: English Copy Integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: english-copy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate English source catalogs
        run: python3 Tools/english_catalog_check.py
