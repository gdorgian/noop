name: Strand
options:
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # Base/development language. The in-source UI strings are authored in English (US);
  # the String Catalog (Strand/Resources/Localizable.xcstrings) carries this as the
  # source language and is where additional languages are added.
  developmentLanguage: en
# Project-level xcconfig: Xcode layers this beneath every target's OWN configFiles (a target-level
# xcconfig only shadows keys it redefines itself), so this is the one place BUNDLE_ID_PREFIX is
# defined — every target picks it up automatically, including Strand/StrandTests/NOOPiOS, which also
# carry Strand/Oura/OuraConfig.xcconfig for their unrelated Oura credentials. See Config/BundleId.xcconfig.
configFiles:
  Debug: Config/BundleId.xcconfig
  Release: Config/BundleId.xcconfig
settings:
  base:
    MARKETING_VERSION: "10.5.0"
    # iOS build number (CFBundleVersion). GLOBAL so the iOS app AND its widget extension inherit the
    # SAME value — they must match or iOS warns "extension version must match parent app" (#416).
    # macOS sets its own CFBundleVersion on the Strand target and is unaffected by this.
    CURRENT_PROJECT_VERSION: "230"
    # Overridden by the release/local xcodebuild command with the exact git revision. Keeping an explicit
    # fallback makes an ad-hoc Xcode build say "unknown" rather than leaking an unresolved $(...) token.
    NOOP_COMMIT_SHA: "unknown"
    SWIFT_VERSION: "5.0"
    # Emit localizable strings so Xcode auto-extracts every LocalizedStringKey into the
    # String Catalog on build (the English (US) base entries).
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # IOS_BUNDLE_ID and APP_GROUP_ID are NOT defined here. They live in Config/BundleId.xcconfig, which
    # ends with `#include? "BundleIdSecrets.xcconfig"` — the gitignored file where a personal signing
    # identity goes. A build setting written here lands in the generated pbxproj at project level, and
    # a project-level pbxproj setting BEATS a project-level xcconfig, so defining them here made the
    # secrets file silently unable to override them. That is not a theoretical ordering problem: it
    # shipped an IPA under the wrong identifiers, which a signing service's explicit App ID cannot
    # install against. Keep them in the xcconfig so the override actually works.
    # Build for both Apple Silicon and Intel so the release runs on every Mac.
    ARCHS: "$(ARCHS_STANDARD)"
  configs:
    Release:
      # Distribution builds must produce a universal binary, not just the host arch.
      ONLY_ACTIVE_ARCH: NO
    Debug:
      # Optimise the LOCAL PACKAGES in Debug; the app targets opt back out to -Onone below.
      #
      # The packages hold the compute: StrandAnalytics runs the sleep stager, the HRV/RMSSD passes and
      # the recovery scoring, over ~950 k samples per scored day. At -Onone that is Swift with no
      # inlining, no specialisation of generics and retain/release on every array access — the analyze
      # pass is dominated by exactly the code that suffers most from it, and this is a debug-built app
      # in daily use, not a throwaway.
      #
      # Xcode compiles SPM package targets against the PROJECT configuration, so setting it here reaches
      # WhoopProtocol / WhoopStore / StrandAnalytics / StrandImport / StrandDesign / OuraProtocol, while
      # each app target's own `SWIFT_OPTIMIZATION_LEVEL: -Onone` (see `targets:`) keeps app code fully
      # steppable. Debug symbols are unaffected either way — `-O` changes codegen, not `-g`.
      SWIFT_OPTIMIZATION_LEVEL: "-O"
packages:
  # Renders the Coach's LLM replies (GitHub-flavored Markdown — bold, lists,
  # headings, tables). Pinned exactly for reproducible community builds.
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
  WhoopProtocol:
    path: Packages/WhoopProtocol
  WhoopStore:
    path: Packages/WhoopStore
  StrandAnalytics:
    path: Packages/StrandAnalytics
  StrandImport:
    path: Packages/StrandImport
  StrandDesign:
    path: Packages/StrandDesign
  SemanticMemory:
    path: Packages/SemanticMemory
  # Clean-room local Oura ring BLE protocol (framing, auth, decoders, driver). Pure value types,
  # zero CoreBluetooth, so it stays headless/JVM-testable; the app target imports it for OuraLiveSource.
  OuraProtocol:
    path: Packages/OuraProtocol
  # Clean-room local Polar sensor facts: model identification + PMD stream capability catalog (pure value
  # types, zero CoreBluetooth, headless/JVM-testable). The app target imports it so StandardHRSource can
  # log which Polar model a connecting strap is, and the Test Centre can auto-detect it from the paired
  # record. The live PMD data path is not wired yet — this is identification/diagnostics only.
  PolarProtocol:
    path: Packages/PolarProtocol
  # Compresses the full-database `.noopbak` backup (single-entry deflate ZIP) in DataBackup.swift.
  # Already resolved transitively via StrandImport; linked directly so the app target can
  # `import ZIPFoundation`. Same exact version as StrandImport's, so SPM resolves one copy.
  # Supply-chain: pinned EXACT (not `from:`) so a clean resolve can't auto-pull a newer —
  # potentially compromised — upstream release. Bump deliberately, in lockstep with the
  # Packages/*/Package.swift exact constraints and the committed Package.resolved.
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
  # Multi-domain Fitness Age scoring (Apache-2.0, Foundation-only, deterministic, golden-tested).
  # It is a pure scorer: it never imports HealthKit, asks for a permission, stores anything, or opens a
  # socket — the host hands it normalized numbers and it hands back a score. That is exactly the shape
  # this app can accept, and why it earns a dependency where a cloud "biological age" service could not.
  #
  # It does NOT replace FitnessAgeEngine or VitalityEngine. Those produce one number each from
  # cardio-metabolic signals; this produces a five-domain breakdown with an explicit confidence and an
  # honest instruments-used count. That breakdown is the part neither existing engine can give.
  #
  # Supply-chain: pinned EXACT, like every other third-party package here. Upstream states minor
  # releases MAY change formulas, weights and results, so the version bump has to be a decision.
  SuperAgeCore:
    url: https://github.com/superageapp/ios-core.git
    exactVersion: 0.4.0
targets:
  Strand:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Strand
        excludes:
          - "Resources/Info.plist"
          - "Resources/Strand.entitlements"
          # The liquid Today is now cross-platform: its iOS-only chrome (topBarTrailing / navigationBarTitleDisplayMode
          # / presentationCompactAdaptation / two-param onChange / sensoryFeedback) is guarded, so the mac split-view
          # shell hosts LiquidTodayView too. All Liquid/* now compile into the mac target.
    # Oura BYO-app OAuth credentials. OuraConfig.xcconfig is a tracked wrapper that optionally
    # includes the untracked, gitignored Strand/Oura/OuraSecrets.xcconfig (template at
    # OuraSecrets.example.xcconfig) — absent secrets leave the $(OURA_*) references in the
    # info.properties below empty, which disables the Oura Cloud lane at runtime.
    configFiles:
      Debug: Strand/Oura/OuraConfig.xcconfig
      Release: Strand/Oura/OuraConfig.xcconfig
    info:
      path: Strand/Resources/Info.plist
      properties:
        CFBundleName: NOOP
        CFBundleDisplayName: NOOP
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "198"
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSBluetoothAlwaysUsageDescription: "NOOP connects directly to your WHOOP strap over Bluetooth to read heart rate, R-R intervals, battery, and sensor data locally on your Mac. Nothing leaves your device."
        NSLocationWhenInUseUsageDescription: "NOOP records your route during an outdoor workout to show distance, pace, and a map. The route stays on your device. Nothing leaves it."
        # The AI Coach's "Custom (OpenAI-compatible)" provider talks to a LOCAL LLM server over plain
        # HTTP on loopback (Ollama / LM Studio / llama.cpp at http://localhost:…). ATS blocks cleartext
        # by default; NSAllowsLocalNetworking exempts loopback/.local/unqualified hosts ONLY — public
        # HTTPS endpoints are unaffected. No arbitrary-loads blanket exemption.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Oura BYO-app OAuth credentials (values come from configFiles above); read at runtime via
        # OuraCredentials.fromBundle. Absent/blank values cleanly disable the Connect-Oura lane.
        OURA_CLIENT_ID: $(OURA_CLIENT_ID)
        OURA_CLIENT_SECRET: $(OURA_CLIENT_SECRET)
        OURA_REDIRECT_URI: $(OURA_REDIRECT_URI)
        # Registers the noop:// URL scheme so ASWebAuthenticationSession's OAuth redirect
        # (noop://oura/callback) reaches OuraOAuthProvider instead of bouncing off the OS.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [noop]
    entitlements:
      path: Strand/Resources/Strand.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.bluetooth: true
        com.apple.security.files.user-selected.read-write: true
        # Outbound client access — used ONLY by the opt-in, consent-gated, BYOK AI Coach.
        # The ad-hoc distributed build applies NO entitlements (unsigned build + ad-hoc
        # re-sign), so this matters only for a SIGNED/sandboxed build (where the sandbox
        # otherwise blocks the Coach's request — #128). Data path stays network-free.
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).noop.staging
        PRODUCT_NAME: "NOOP Staging"
        # Pin the Swift module name so `@testable import Strand` resolves even though PRODUCT_NAME is
        # NOOP — the test target and shared sources refer to the app module as `Strand`.
        PRODUCT_MODULE_NAME: Strand
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # Hardened Runtime closes the DYLD_INSERT_LIBRARIES injection vector for the
        # distributed (ad-hoc) build. The app uses no JIT / unsigned-exec memory, so it's safe.
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
      configs:
        # Opt the APP module back out of the project-wide Debug `-O` (see `configs:` at the top): the
        # packages get optimised so the analyze pass is usable in a debug build, this stays -Onone so
        # app code steps and inspects normally.
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    dependencies:
      - package: WhoopProtocol
      - package: WhoopStore
      - package: StrandAnalytics
      - package: StrandImport
      - package: StrandDesign
      - package: SemanticMemory
      - package: MarkdownUI
      - package: ZIPFoundation
      - package: OuraProtocol
      - package: PolarProtocol
      - package: SuperAgeCore
  StrandTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - StrandTests
      # Compile the exact cross-target snapshot source into the test bundle so the AltStore App Group
      # resolver is covered without adding this iOS/widget-only type to the macOS application module.
      - StrandiOSShared/WidgetSnapshot.swift
    # Same wrapper as the app target, so the OURA_CLOUD_IMPORT-gated Oura tests compile exactly
    # when the app's Oura lane does (flag + creds both come from the untracked OuraSecrets.xcconfig).
    configFiles:
      Debug: Strand/Oura/OuraConfig.xcconfig
      Release: Strand/Oura/OuraConfig.xcconfig
    dependencies:
      - target: Strand
      - package: WhoopProtocol
      - package: WhoopStore
      - package: OuraProtocol
      - package: SemanticMemory
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).strandtests
        # Host the unit tests in the app so `@testable import Strand` links against the real app module.
        # NOTE: must track the app target's PRODUCT_NAME ("NOOP Staging" since the staging rename).
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NOOP Staging.app/Contents/MacOS/NOOP Staging"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # ---------------------------------------------------------------------------
  # iOS app target (community build-from-source; never distributed via the App
  # Store — NOOP stays anonymous). Reuses the five shared packages + most of the
  # macOS app's Strand/ sources; the macOS-only scene/menu-bar/notification files
  # are excluded, and the iOS app shell + HealthKit + widgets/intents live under
  # StrandiOS/. See docs/IOS.md.
  NOOPiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Strand
        excludes:
          - "Resources/Info.plist"
          - "Resources/Strand.entitlements"
          - "Resources/Assets.xcassets"
          - "App/StrandApp.swift"
          - "App/RootView.swift"
          # ContentView embeds RootView() (the macOS NavigationSplitView sidebar shell), which is
          # excluded above — so ContentView cannot compile on iOS. The iOS shell is RootTabView,
          # wired in StrandiOS/App/StrandiOSApp.swift (which reproduces ContentView's onboarding/
          # Terms/What's-New gates around the TabView). Without this exclude the iOS target fails to
          # resolve RootView().
          - "App/ContentView.swift"
          - "MenuBar"
          - "Data/NotificationSettingsStore.swift"
          - "Screens/NotificationSettingsView.swift"
          # macOS-only AppIntents (BuzzStrap/MarkMoment) — iOS uses StrandiOS/System/NOOPAppIntents.swift.
          # Without this exclude both compile into the iOS target and collide on NOOPAppIntents.stringsdata.
          - "System/NOOPAppIntents.swift"
      - path: StrandiOS
        excludes:
          - "Resources/Info.plist"
          - "Resources/NOOP.entitlements"
      - path: StrandiOSShared
      # Installed by Tools/bootstrap-nomic.sh before xcodegen. The final app contains the pinned model;
      # there is no runtime download and no model load during ordinary app launch.
      - path: Vendor/Nomic/Resources
        buildPhase: resources
    # Same tracked wrapper as the macOS target (Strand/Oura/ is shared, not per-platform).
    configFiles:
      Debug: Strand/Oura/OuraConfig.xcconfig
      Release: Strand/Oura/OuraConfig.xcconfig
    info:
      path: StrandiOS/Resources/Info.plist
      properties:
        CFBundleName: Noop
        # The approved installed name for this fork. Keep both keys in lockstep and verify the packaged
        # Info.plist; upstream/fork merges have changed the Home Screen label before.
        CFBundleDisplayName: Noop
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NoopCommitSHA: "$(NOOP_COMMIT_SHA)"
        # Canonical HTML typography. Bundled locally so the native iOS UI never depends on a font request.
        UIAppFonts:
          # Xcode's synchronized resources flatten these files into the app-bundle root.
          - Outfit.ttf
          - InstrumentSans.ttf
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
        # Surfaces APP_GROUP_ID to runtime (WidgetSnapshot.suiteName) so the App Group id isn't
        # hard-coded in Swift; stays in sync with the application-groups entitlement (both $(APP_GROUP_ID)).
        AppGroupIdentifier: "$(APP_GROUP_ID)"
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        UILaunchScreen: {}
        # ProMotion opt-in. WITHOUT this key iOS clamps every app-driven animation to 60Hz on a 120Hz
        # panel — CADisplayLink, Core Animation, and SwiftUI's TimelineView(.animation) alike. The app
        # never declared it, so the whole liquid layer has been running at half the panel's rate on
        # every Pro iPhone since it was written, which is exactly the "why isn't this 120Hz / feels like
        # an old phone" the display is capable of and the app was not asking for.
        #
        # Worth knowing what this does NOT fix: system-driven scrolling was already running at 120Hz,
        # so this makes the app's own motion match the panel rather than making scrolling faster. Frame
        # COST is the separate problem, handled by the liquid idle stand-down.
        CADisableMinimumFrameDuration: true
        # Alternate app icons (v3 "Titanium & Gold"). The primary icon stays the asset-catalog
        # AppIcon (machined titanium); the alternate "AppIcon-Navy" (blued titanium) is declared
        # here so UIApplication.setAlternateIconName("AppIcon-Navy") can switch to it at runtime.
        # CFBundleIconFiles is intentionally empty — the artwork lives in the asset catalog, shipped
        # via ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS, so no loose PNGs are listed here.
        CFBundleIcons:
          CFBundleAlternateIcons:
            AppIcon-Navy:
              CFBundleIconFiles: []
              UIPrerenderedIcon: false
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - bluetooth-central
          # #524: keep recording an outdoor workout's GPS route while the app is backgrounded (screen off),
          # matching Android's foreground-service capture. Required by GpsWorkoutRecorder's
          # allowsBackgroundLocationUpdates; without this mode iOS crashes when background updates start.
          - location
          # #510: the scheduled debug auto-export submits a BGAppRefreshTaskRequest so iOS can wake the
          # backgrounded app near the user's chosen time to write the overnight strap-log drop. BGAppRefresh
          # needs the "fetch" background mode; the task id below must also be permitted (and registered at
          # launch in StrandiOSApp.init) or the submit fails gracefully and only the foreground/"Run now"
          # paths run.
          - fetch
        # Permit every BGAppRefreshTask/BGProcessingTask identifier. Each derives from Bundle.main at
        # runtime so it tracks BUNDLE_ID_PREFIX, and each is registered from StrandiOSApp.init before
        # launch finishes. MUST match the registering site EXACTLY or iOS refuses to schedule/deliver.
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).debugexport
          # Best-effort local semantic-memory indexing. No network access; iOS decides whether and when
          # the processing lease is granted.
          - $(PRODUCT_BUNDLE_IDENTIFIER).semanticmemory
          # Best-effort network work, scheduled only after the wearer enables proactive Svea briefs.
          - $(PRODUCT_BUNDLE_IDENTIFIER).sveaproactive
          # Best-effort fallback that writes already-banked WHOOP data to HealthKit when iOS grants
          # background time. Fresh offloads also write immediately from their completion hook.
          - $(PRODUCT_BUNDLE_IDENTIFIER).healthwriteback
        NSBluetoothAlwaysUsageDescription: "Noop connects directly to your WHOOP strap to read heart rate, R-R intervals, battery and sensor data on your iPhone. Sharing occurs only through an export, backup, Apple Health write or Svea provider you explicitly enable."
        NSLocationWhenInUseUsageDescription: "Noop records your route during an outdoor workout to show distance, pace and a map, including while the screen is off. The route is stored locally unless you export or back up the activity."
        NSHealthShareUsageDescription: "Noop reads the Apple Health data types you approve to compute recovery, effort and sleep. They stay local unless you explicitly export, back up or consent to share a category with a configured Svea provider."
        NSHealthUpdateUsageDescription: "Noop writes the metrics it computes from your strap back into Apple Health, on-device and only when you allow it."
        # NOOP does not read clinical health records. This string is declared anyway because the
        # entitlement that would require it is not always ours to choose: a signing identity whose
        # provisioning profile carries `com.apple.developer.healthkit.access = [health-records]` has that
        # entitlement applied to the app at SIGNING time, and iOS terminates an app holding it without a
        # matching usage string. Declaring it costs nothing (no prompt is shown unless the app actually
        # requests records) and turns an unexplained launch failure into a non-event.
        NSHealthClinicalHealthRecordsShareUsageDescription: "Noop does not read clinical health records. This appears only because the certificate used to sign Noop grants that capability."
        NSMotionUsageDescription: "Noop reads your iPhone's step count for a walking or running workout and shows it in the activity summary. It stays local unless you export or back up the activity."
        # #187: the opt-in AI Coach's "Custom (OpenAI-compatible)" provider can point at a LOCAL LLM on
        # the LAN (Ollama / LM Studio at http://192.168.x.x:11434). ATS blocks cleartext by default;
        # NSAllowsLocalNetworking exempts loopback/.local/private-LAN hosts ONLY — public HTTPS endpoints
        # are unaffected, so cloud providers stay TLS. Mirrors the macOS target.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # #155: expose the app's Documents folder to Files/Shortcuts so the user's Siri Shortcut can
        # read the opt-in noop_sync.txt drop file (Apple-Health-free export for sideloaded installs).
        # Both keys are required for the folder to actually appear in Files.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Oura BYO-app OAuth credentials (values come from configFiles above); read at runtime via
        # OuraCredentials.fromBundle. Absent/blank values cleanly disable the Connect-Oura lane.
        OURA_CLIENT_ID: $(OURA_CLIENT_ID)
        OURA_CLIENT_SECRET: $(OURA_CLIENT_SECRET)
        OURA_REDIRECT_URI: $(OURA_REDIRECT_URI)
        # Registers the noop:// URL scheme so ASWebAuthenticationSession's OAuth redirect
        # (noop://oura/callback) reaches OuraOAuthProvider instead of bouncing off the OS.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [noop]
    entitlements:
      path: StrandiOS/Resources/NOOP.entitlements
      properties:
        com.apple.developer.healthkit: true
        # Required by HealthKit on iOS 15+ for the observer queries registered by HealthKitBridge.
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IOS_BUNDLE_ID)
        PRODUCT_NAME: "Noop"
        # Keep the Swift module stable while changing the installed product name. The iOS tests and
        # downstream source imports predate the installed-product rename and intentionally use this identifier.
        PRODUCT_MODULE_NAME: NOOP_Staging
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Ship every *.appiconset (not just the primary AppIcon) so the alternate "AppIcon-Navy"
        # set is compiled into the bundle and is available to UIApplication.setAlternateIconName.
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        # Same opt-out as the macOS target: packages optimised in Debug, app code left steppable.
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    dependencies:
      - package: WhoopProtocol
      - package: WhoopStore
      - package: StrandAnalytics
      - package: StrandImport
      - package: StrandDesign
      - package: SemanticMemory
      - package: MarkdownUI
      - package: ZIPFoundation
      - package: PolarProtocol
      - package: SuperAgeCore
      - framework: Vendor/Nomic/llama.xcframework
        embed: true
      - target: NOOPiOSWidgets
      # This fork is signed and installed as an iPhone-only Arctic/Feather build. There is no watchOS
      # companion to embed — the watch targets were removed with Android; see the iOS-only strip commit.

  NOOPiOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - StrandiOSTests
    dependencies:
      - target: NOOPiOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).noop.ios.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Noop.app/Noop"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # WidgetKit + Live Activity extension — the iOS analogue of the macOS menu-bar
  # extra. Reads a tiny snapshot the app publishes into the shared App Group.
  NOOPiOSWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StrandiOSWidgets
        excludes:
          - "Info.plist"
          - "NOOPWidgets.entitlements"
      - path: StrandiOSShared
    info:
      path: StrandiOSWidgets/Info.plist
      properties:
        CFBundleDisplayName: Noop
        # Version keys MUST live here in the generated-Info.plist properties — NOT hand-edited into the
        # file — because xcodegen regenerates StrandiOSWidgets/Info.plist on every `xcodegen generate`
        # (which every release runs for the version bump) and would otherwise rewrite them to its
        # defaults 1.0 / 1. Inheriting $(MARKETING_VERSION)/$(CURRENT_PROJECT_VERSION) keeps the widget
        # extension lockstep with the parent app, so iOS stops warning "extension version must match
        # parent app" (#416). This is the durable fix; the earlier file edit silently reverted.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Mirrors the app target: exposes APP_GROUP_ID to the extension at runtime (WidgetSnapshot.suiteName).
        AppGroupIdentifier: "$(APP_GROUP_ID)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: StrandiOSWidgets/NOOPWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IOS_BUNDLE_ID).widgets
        PRODUCT_NAME: NOOPWidgets
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: StrandDesign
# Explicit schemes so `xcodebuild -scheme Strand …` builds + tests the macOS app (with StrandTests
# wired in) and `-scheme NOOPiOS …` builds the iOS app. Names match the app-build CI matrix.
schemes:
  Strand:
    build:
      targets:
        Strand: all
    run:
      config: Debug
      diagnostics:
        mainThreadChecker: true
    test:
      config: Debug
      language: en
      region: US
      targets:
        - StrandTests
  NOOPiOS:
    build:
      targets:
        NOOPiOS: all
    run:
      config: Debug
      diagnostics:
        mainThreadChecker: true
    test:
      config: Debug
      language: de
      region: DE
      targets:
        - NOOPiOSTests
